<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>로그인 – 처리 중</title>

</head>
<body style="background:#f5f5f5;display:flex;justify-content:center;padding:0;margin:0;">


<style>
@font-face{font-family:'JetBrains Mono';font-weight:400;src:url(../fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:500;src:url(../fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
</style>
<style>
@font-face{font-family:"Pretendard";font-weight:400;font-style:normal;font-display:swap;src:url(../fonts/Pretendard-Regular.woff2) format("woff2")}
@font-face{font-family:"Pretendard";font-weight:500;font-style:normal;font-display:swap;src:url(../fonts/Pretendard-Medium.woff2) format("woff2")}
@font-face{font-family:"Pretendard";font-weight:600;font-style:normal;font-display:swap;src:url(../fonts/Pretendard-SemiBold.woff2) format("woff2")}
body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:#ffffff;color:#0a0a0a;-webkit-font-smoothing:antialiased}
a{color:#0a0a0a;text-decoration:none}a:hover{color:#525252}
input::placeholder{color:#a3a3a3}
</style>

<div style="position: relative; width: 1440px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; font-size: 14px; line-height: 1.5; color: #0a0a0a;">
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  <main style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 24px;"><div style="width: 400px; display: flex; flex-direction: column; gap: 28px; opacity: 0.55;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center;">
        <span style="width: 40px; height: 40px; border-radius: 10px; background: #0a0a0a; color: #ffffff; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center;">P</span>
        <div style="display: flex; flex-direction: column; gap: 6px;"><h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.01em; color: #0a0a0a;">Probe QA에 로그인</h1><p style="margin: 0; font-size: 14px; color: #737373;">분석 요청과 비공개 QA 결과에 접근합니다.</p></div>
      </div>
      <form novalidate style="display: flex; flex-direction: column; gap: 16px;" onsubmit="return false">
        <div style="display: flex; flex-direction: column; gap: 6px;"><label for="email" style="font-size: 13px; font-weight: 500; color: #0a0a0a;">이메일</label><input id="email" type="email" placeholder="name@company.com" autocomplete="username" aria-invalid="false" style="height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #e5e5e5; border-radius: 8px; font-family: inherit; font-size: 14px; color: #0a0a0a; outline: none;"></div>
        <div style="display: flex; flex-direction: column; gap: 6px;"><div style="display: flex; justify-content: space-between; align-items: baseline;"><label for="pw" style="font-size: 13px; font-weight: 500; color: #0a0a0a;">비밀번호</label><a href="#" style="font-size: 13px; color: #737373;">비밀번호를 잊으셨나요?</a></div><input id="pw" type="password" placeholder="••••••••" autocomplete="current-password" aria-invalid="false" style="height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #e5e5e5; border-radius: 8px; font-family: inherit; font-size: 14px; color: #0a0a0a; outline: none;"></div>
        <a href="M01_Entry.html" style="display: flex; align-items: center; justify-content: center; height: 40px; margin-top: 4px; border-radius: 999px; background: #0a0a0a; color: #ffffff; font-size: 14px; font-weight: 600;">로그인</a>
        
      </form>
      <div style="box-sizing: border-box; padding: 16px; background: #fafafa; border-radius: 12px; display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; justify-content: space-between; align-items: baseline;"><span style="font-size: 13px; font-weight: 600; color: #0a0a0a;">심사용 계정</span><a href="#" style="font-size: 13px; font-weight: 500; color: #0a0a0a;">심사용 계정으로 채우기 →</a></div>
        <div style="display: grid; grid-template-columns: 64px 1fr; gap: 6px 12px; align-items: baseline;">
          <span style="font-size: 12px; color: #a3a3a3;">이메일</span><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: #0a0a0a;">qa-admin@scenario-qa.app</span>
          <span style="font-size: 12px; color: #a3a3a3;">비밀번호</span><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: #0a0a0a;">ProbeQA!V9k7#R4m2@2026</span>
        </div>
        <p style="margin: 0; font-size: 12px; color: #a3a3a3;">심사 기간에만 제공되는 공용 계정입니다. 외부에 공유하지 마세요.</p>
      </div>
    </div></main><footer style="height: 48px; box-sizing: border-box; padding: 0 120px; display: flex; align-items: center; justify-content: center; gap: 16px; font-size: 12px; color: #a3a3a3; flex-shrink: 0;"><span style="font-weight: 500;">Probe QA</span><span style="width: 1px; height: 10px; background: #e5e5e5;"></span><span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;">v1.4</span><span style="width: 1px; height: 10px; background: #e5e5e5;"></span><a href="#" style="color: #a3a3a3;">이용 안내</a></footer>
  <div role="status" aria-live="polite" style="position: absolute; inset: 0; background: rgba(255,255,255,0.6); display: flex; align-items: center; justify-content: center;">
    <div style="width: 280px; box-sizing: border-box; padding: 28px 24px 24px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 14px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;">
      <svg aria-hidden="true" width="28" height="28" viewBox="0 0 28 28" fill="none" style="display: block; animation: spin 0.9s linear infinite;"><circle cx="14" cy="14" r="11" stroke="#e5e5e5" stroke-width="2.5"></circle><path d="M25 14a11 11 0 0 0-11-11" stroke="#0a0a0a" stroke-width="2.5" stroke-linecap="round"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 14px; font-weight: 600; color: #0a0a0a;">요청을 처리하고 있습니다</span><span style="font-size: 13px; color: #737373;">잠시만 기다려 주세요.</span></div>
    </div>
  </div>
</div>


</body>
</html>
