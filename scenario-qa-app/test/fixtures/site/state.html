<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Probe QA State Fixture</title><style>body{font-family:system-ui;margin:40px}button,input{margin:8px;padding:8px}</style></head>
<body><main><h1>상태 변화 요소</h1><button type="button" data-testid="accordion-button" aria-expanded="false" aria-controls="accordion-panel">상세 정보 열기</button><div id="accordion-panel" data-testid="accordion-panel" hidden>확장된 상세 정보</div><button type="button" data-testid="notice-close">안내 닫기</button><div role="alert" data-testid="state-notice">상태 안내</div><button type="button" data-testid="value-change">값 변경</button><input data-testid="status-value" value="대기" readonly><button type="button" data-testid="item-add">항목 추가</button><ul id="state-items"><li>첫 번째</li><li>두 번째</li></ul></main>
<script>document.querySelector('[data-testid="accordion-button"]').addEventListener('click',event=>{const button=event.currentTarget;const expanded=button.getAttribute('aria-expanded')==='true';button.setAttribute('aria-expanded',String(!expanded));document.querySelector('#accordion-panel').hidden=expanded});document.querySelector('[data-testid="notice-close"]').addEventListener('click',()=>{document.querySelector('[data-testid="state-notice"]').hidden=true});document.querySelector('[data-testid="value-change"]').addEventListener('click',()=>{document.querySelector('[data-testid="status-value"]').value='완료'});document.querySelector('[data-testid="item-add"]').addEventListener('click',()=>{const item=document.createElement('li');item.textContent='세 번째';document.querySelector('#state-items').append(item)});</script></body></html>
