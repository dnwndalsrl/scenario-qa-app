name: scenario-qa

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    build:
      context: ..
      dockerfile: scenario-qa-app/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-development}
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
        BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-unknown}
    image: ${APP_IMAGE:-scenario-qa-app}:${APP_VERSION:-latest}
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      TZ: UTC
      APP_VERSION: ${APP_VERSION:-development}
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
      BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-unknown}
      DEPLOYED_AT: ${DEPLOYED_AT:-unknown}
      NUXT_STORAGE_ROOT: /app/storage
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    expose:
      - "3000"
    volumes:
      - ./data/storage:/app/storage
      - ./data/artifacts:/app/storage/artifacts
      - ./data/backups:/app/backups:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m,uid=10001,gid=10001
    shm_size: 1gb
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 3g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      start_period: 45s
      retries: 3
    networks:
      - qa_net
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    environment:
      DOMAIN: ${DOMAIN}
      NGINX_ENVSUBST_FILTER: DOMAIN
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/${NGINX_CONFIG_FILE:-default.conf.template}:/etc/nginx/templates/default.conf.template:ro
      - ./data/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 15s
    networks:
      - qa_net
    logging: *default-logging

  certbot:
    image: certbot/certbot:v5.7.0
    profiles: ["tools"]
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    networks:
      - qa_net
    logging: *default-logging

networks:
  qa_net:
    driver: bridge
