name: Deploy click runtime recovery
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install verified files
        run: |
          echo '' | base64 --decode > scenario-qa-app/server/playwright/test-executor.ts
          echo '' | base64 --decode > scenario-qa-app/server/playwright/page-collector.test.ts
          echo '' | base64 --decode > scenario-qa-app/test/fixtures/site/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scenario-qa-app/server/playwright/test-executor.ts scenario-qa-app/server/playwright/page-collector.test.ts scenario-qa-app/test/fixtures/site/index.html
          git rm .github/workflows/deploy-click-runtime-recovery.yml
          git commit -m "Recover transiently blocked navigation clicks"
          git push
