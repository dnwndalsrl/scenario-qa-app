name: Codex deploy current verdict

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 'scenario-qa-app/assets/scss'
          echo '' | base64 -d > 'scenario-qa-app/assets/scss/main.scss'
          mkdir -p 'scenario-qa-app/components/analysis'
          echo '' | base64 -d > 'scenario-qa-app/components/analysis/TestRunResult.vue'
          mkdir -p 'scenario-qa-app/server/analysis/services'
          echo '' | base64 -d > 'scenario-qa-app/server/analysis/services/analysis-summary.service.test.ts'
          mkdir -p 'scenario-qa-app/server/analysis/services'
          echo '' | base64 -d > 'scenario-qa-app/server/analysis/services/analysis-summary.service.ts'
          mkdir -p 'scenario-qa-app/server/services'
          echo '' | base64 -d > 'scenario-qa-app/server/services/analysis-records.service.ts'
          mkdir -p 'scenario-qa-app/shared/utils'
          echo '' | base64 -d > 'scenario-qa-app/shared/utils/test-run-history.test.ts'
          mkdir -p 'scenario-qa-app/shared/utils'
          echo '' | base64 -d > 'scenario-qa-app/shared/utils/test-run-history.ts'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'scenario-qa-app/assets/scss/main.scss' 'scenario-qa-app/components/analysis/TestRunResult.vue' 'scenario-qa-app/server/analysis/services/analysis-summary.service.test.ts' 'scenario-qa-app/server/analysis/services/analysis-summary.service.ts' 'scenario-qa-app/server/services/analysis-records.service.ts' 'scenario-qa-app/shared/utils/test-run-history.test.ts' 'scenario-qa-app/shared/utils/test-run-history.ts'
          git rm '.github/workflows/codex-deploy-current-verdict.yml'
          git commit -m 'Use latest reruns for current QA verdict'
          git push origin main
