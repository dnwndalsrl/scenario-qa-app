name: Deploy verified click order
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install verified file
        run: |
          echo '' | base64 --decode > scenario-qa-app/server/playwright/test-executor.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scenario-qa-app/server/playwright/test-executor.ts
          git rm .github/workflows/deploy-verified-click-order.yml
          git commit -m "Click verified targets before hover trials"
          git push
