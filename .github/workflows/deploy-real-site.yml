name: Deploy verified real-site validation
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified source tree
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/deployment-real-site.bundle
          git fetch /tmp/deployment-real-site.bundle rebuild/url-ai-qa-agent:refs/remotes/local/verified
          git read-tree --reset -u refs/remotes/local/verified
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Deploy real-site validation hardening"
          git push origin HEAD:main
