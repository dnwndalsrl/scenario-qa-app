name: Deploy verified click outcomes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply verified changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 'scenario-qa-app/server/analysis/prompts'
          printf '%s' '' | base64 -d > 'scenario-qa-app/server/analysis/prompts/test-generation.prompt.ts'
          mkdir -p 'scenario-qa-app/server/analysis'
          printf '%s' '' | base64 -d > 'scenario-qa-app/server/analysis/schemas.test.ts'
          mkdir -p 'scenario-qa-app/server/analysis/services'
          printf '%s' '' | base64 -d > 'scenario-qa-app/server/analysis/services/ai-test-generation.service.ts'
          mkdir -p 'scenario-qa-app/server/playwright'
          printf '%s' '' | base64 -d > 'scenario-qa-app/server/playwright/click-outcome.test.ts'
          mkdir -p 'scenario-qa-app/server/playwright'
          printf '%s' '' | base64 -d > 'scenario-qa-app/server/playwright/click-outcome.ts'
          mkdir -p 'scenario-qa-app/server/playwright'
          printf '%s' '' | base64 -d > 'scenario-qa-app/server/playwright/test-executor.ts'
          mkdir -p 'scenario-qa-app/shared'
          printf '%s' '' | base64 -d > 'scenario-qa-app/shared/errors.ts'
      - name: Commit and deploy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scenario-qa-app/server/analysis/prompts/test-generation.prompt.ts scenario-qa-app/server/analysis/schemas.test.ts scenario-qa-app/server/analysis/services/ai-test-generation.service.ts scenario-qa-app/server/playwright/click-outcome.test.ts scenario-qa-app/server/playwright/click-outcome.ts scenario-qa-app/server/playwright/test-executor.ts scenario-qa-app/shared/errors.ts
          git commit -m 'Verify click navigation and scroll outcomes'
          git rm '.github/workflows/codex-deploy-click-outcomes.yml'
          git commit -m 'Remove temporary deployment workflow'
          git push origin HEAD:main
