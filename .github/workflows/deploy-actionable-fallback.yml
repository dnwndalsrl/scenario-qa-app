name: Deploy actionable fallback filter
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install verified files
        run: |
          echo '' | base64 --decode > scenario-qa-app/server/analysis/schemas.test.ts
          echo '' | base64 --decode > scenario-qa-app/server/analysis/services/ai-test-generation.service.ts
      - name: Commit production fix
        run: |
          rm .github/workflows/deploy-actionable-fallback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Exclude non-actionable fallback links"
          git push origin main
