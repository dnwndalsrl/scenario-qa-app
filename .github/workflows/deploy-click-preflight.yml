name: Deploy click actionability preflight
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install verified files
        run: |
          echo '' | base64 --decode > scenario-qa-app/server/analysis/prompts/test-generation.prompt.ts
          echo '' | base64 --decode > scenario-qa-app/server/analysis/schemas.test.ts
          echo '' | base64 --decode > scenario-qa-app/server/analysis/services/ai-test-generation.service.ts
          echo '' | base64 --decode > scenario-qa-app/server/playwright/page-collector.test.ts
          echo '' | base64 --decode > scenario-qa-app/server/playwright/page-collector.ts
          echo '' | base64 --decode > scenario-qa-app/shared/types/analysis.ts
          echo '' | base64 --decode > scenario-qa-app/test/fixtures/site/index.html
      - name: Commit production fix
        run: |
          rm .github/workflows/deploy-click-preflight.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preflight click targets before generation"
          git push origin main
