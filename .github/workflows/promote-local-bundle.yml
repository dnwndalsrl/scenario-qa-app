name: Promote verified local bundle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote verified application files
        run: |
          cat .deploy/probe.part1 .deploy/probe.part2 | base64 --decode > /tmp/probe.bundle
          git bundle verify /tmp/probe.bundle
          git fetch /tmp/probe.bundle rebuild/url-ai-qa-agent:refs/remotes/bundle/deploy
          test "$(git rev-parse refs/remotes/bundle/deploy)" = "a846529524c877a20cab873f8d8079675ad67ff4"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B promoted "$GITHUB_SHA"
          git checkout refs/remotes/bundle/deploy -- . ':(exclude).github/workflows' ':(exclude).deploy'
          git add -A
          git commit -m "feat: deploy staged requirements-driven QA flow"
          git push origin HEAD:main
