      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scenario-qa-app/package-lock.json
      - name: Install dependencies
        working-directory: scenario-qa-app
        run: npm ci
      - name: Install Chromium
        working-directory: scenario-qa-app
        run: npx playwright install chromium --with-deps
      - name: Verify application
        working-directory: scenario-qa-app
        run: npm run check
      - name: Commit verified change
        shell: bash
        run: |
          rm .github/workflows/apply-main-ui-simplification.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Simplify analysis landing page"
          git push origin HEAD:main
