name: Deploy redesigned analysis entry

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Write verified UI files
        shell: bash
        env:
          MAIN_SCSS_B64: |
            
          ANALYSIS_FORM_B64: |
            
          INDEX_PAGE_B64: |
            
        run: |
          printf '%s' "$MAIN_SCSS_B64" | base64 --decode > scenario-qa-app/assets/scss/main.scss
          printf '%s' "$ANALYSIS_FORM_B64" | base64 --decode > scenario-qa-app/components/analysis/UrlAnalysisForm.vue
          printf '%s' "$INDEX_PAGE_B64" | base64 --decode > scenario-qa-app/pages/index.vue
      - name: Verify UTF-8 source
        shell: bash
        run: |
          grep -Fq "URL을 넣으면" scenario-qa-app/pages/index.vue
          grep -Fq "분석할 대상을 등록하세요" scenario-qa-app/components/analysis/UrlAnalysisForm.vue
      - name: Commit production UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scenario-qa-app/assets/scss/main.scss scenario-qa-app/components/analysis/UrlAnalysisForm.vue scenario-qa-app/pages/index.vue
          git diff --cached --check
          git commit -m "Restore verified analysis target UI"
          git push origin main
