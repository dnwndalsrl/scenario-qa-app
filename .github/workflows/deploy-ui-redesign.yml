name: Deploy redesigned analysis entry

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply verified UI patch
        shell: bash
        env:
          PATCH_B64: |
            
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/ui-redesign.patch
          git apply --check /tmp/ui-redesign.patch
          git apply /tmp/ui-redesign.patch
      - name: Commit production UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scenario-qa-app/assets/scss/main.scss scenario-qa-app/components/analysis/UrlAnalysisForm.vue scenario-qa-app/pages/index.vue
          git commit -m "Redesign analysis target entry"
          git push origin main
