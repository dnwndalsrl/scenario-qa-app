name: Deploy CI browser install fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified workflow
        run: |
          echo '' | base64 --decode > .github/workflows/run-qa-analysis.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/run-qa-analysis.yml
          git rm .github/workflows/deploy-ci-browser-install.yml
          git commit -m "Avoid redundant CI system dependency install"
          git push
