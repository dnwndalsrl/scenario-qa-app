name: Deploy verified dynamic QA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply verified commit tree
        env:
          BUNDLE_BASE64: ""
        run: |
          printf '%s' "$BUNDLE_BASE64" | base64 --decode > /tmp/verified.bundle
          git fetch /tmp/verified.bundle refs/heads/rebuild/url-ai-qa-agent:refs/remotes/local/verified
          git read-tree --reset -u refs/remotes/local/verified
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy dynamic state execution"
          git push origin HEAD:main
