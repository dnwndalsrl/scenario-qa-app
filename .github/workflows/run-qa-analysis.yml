name: Run QA analysis

on:
  workflow_dispatch:
    inputs:
      analysis_id:
        description: Supabase analysis UUID
        required: true
        type: string
      mode:
        description: Full analysis or one generated test
        required: true
        default: analysis
        type: choice
        options:
          - analysis
          - single_test
      test_id:
        description: Supabase generated_tests UUID for single_test mode
        required: false
        type: string
      test_run_id:
        description: Supabase test_runs UUID for single_test mode
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: probe-qa-global
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scenario-qa-app
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_PAGE_ANALYSIS_MODEL: ${{ secrets.OPENAI_PAGE_ANALYSIS_MODEL || 'gpt-5-mini' }}
      OPENAI_TEST_GENERATION_MODEL: ${{ secrets.OPENAI_TEST_GENERATION_MODEL || 'gpt-5-mini' }}
      ANALYSIS_SCREENSHOT_ENABLED: "true"
      DEFAULT_CRAWL_PAGES: ${{ vars.DEFAULT_CRAWL_PAGES || '3' }}
      MAX_CRAWL_PAGES: ${{ vars.MAX_CRAWL_PAGES || '5' }}
      DEFAULT_CRAWL_DEPTH: ${{ vars.DEFAULT_CRAWL_DEPTH || '1' }}
      MAX_CRAWL_DEPTH: ${{ vars.MAX_CRAWL_DEPTH || '2' }}
      MAX_TOTAL_AUTO_RUN_TESTS: ${{ vars.MAX_TOTAL_AUTO_RUN_TESTS || '8' }}
      MAX_TOTAL_GENERATED_TESTS: ${{ vars.MAX_TOTAL_AUTO_RUN_TESTS || '8' }}
      PAGE_LOAD_TIMEOUT_MS: ${{ vars.PAGE_LOAD_TIMEOUT_MS || '20000' }}
      CRAWL_TOTAL_TIMEOUT_MS: ${{ vars.CRAWL_TOTAL_TIMEOUT_MS || '180000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scenario-qa-app/package-lock.json
      - name: Install dependencies
        run: npm ci --include=optional
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate input and secrets
        run: npm run qa:validate-input -- --analysis-id=${{ inputs.analysis_id }}
      - name: Run QA analysis
        if: inputs.mode == 'analysis'
        run: npm run qa:run -- --analysis-id=${{ inputs.analysis_id }}
      - name: Run one QA test
        if: inputs.mode == 'single_test'
        run: npm run qa:run-test -- --analysis-id=${{ inputs.analysis_id }} --test-id=${{ inputs.test_id }} --test-run-id=${{ inputs.test_run_id }}
      - name: Mark interrupted analysis failed
        if: failure() && inputs.mode == 'analysis'
        run: npm run qa:mark-failed -- --analysis-id=${{ inputs.analysis_id }}
      - name: Mark interrupted test failed
        if: failure() && inputs.mode == 'single_test'
        run: npm run qa:mark-test-failed -- --test-run-id=${{ inputs.test_run_id }}
      - name: Upload short-lived diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ inputs.analysis_id }}
          path: scenario-qa-app/.qa-runs/${{ inputs.analysis_id }}/
          if-no-files-found: ignore
          retention-days: 3
