name: Apply scenario session write fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply focused changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path("scenario-qa-app/server/api/analyses/[analysisId]/tests/[testId].put.ts"): [
                  ('import { createServiceSupabaseClient, requireUser } from "../../../../services/supabase.service";', 'import { requireUser } from "../../../../services/supabase.service";'),
                  ('const admin = createServiceSupabaseClient(event);', 'const admin = client;'),
              ],
              Path("scenario-qa-app/server/api/analyses/[analysisId]/tests/index.post.ts"): [
                  ('import { createServiceSupabaseClient, requireUser } from "../../../../services/supabase.service";', 'import { requireUser } from "../../../../services/supabase.service";'),
                  ('const admin = createServiceSupabaseClient(event);', 'const admin = client;'),
              ],
              Path("scenario-qa-app/server/api/analyses/[analysisId]/tests/[testId]/runs.post.ts"): [
                  ('import { createServiceSupabaseClient, requireUser } from "../../../../../services/supabase.service";', 'import { requireUser } from "../../../../../services/supabase.service";'),
                  ('const admin = createServiceSupabaseClient(event);', 'const admin = client;'),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"missing expected text in {path}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

          migration = Path("scenario-qa-app/supabase/migrations/202608110005_authenticated_scenario_editor.sql")
          migration.write_text("""-- Scenario changes originate from a logged-in user. Keep these writes on the
-- user's JWT so row-level security enforces ownership.
grant insert, update on table public.generated_tests to authenticated;
grant insert, delete on table public.generated_test_steps to authenticated;
grant insert, update on table public.test_runs to authenticated;

create policy generated_tests_insert_own on public.generated_tests
  for insert to authenticated with check (user_id = auth.uid());
create policy generated_tests_update_own on public.generated_tests
  for update to authenticated using (user_id = auth.uid()) with check (user_id = auth.uid());

create policy generated_test_steps_insert_own on public.generated_test_steps
  for insert to authenticated with check (user_id = auth.uid());
create policy generated_test_steps_delete_own on public.generated_test_steps
  for delete to authenticated using (user_id = auth.uid());

create policy test_runs_insert_own on public.test_runs
  for insert to authenticated with check (user_id = auth.uid());
create policy test_runs_update_own on public.test_runs
  for update to authenticated using (user_id = auth.uid()) with check (user_id = auth.uid());
""", encoding="utf-8")

          test_path = Path("scenario-qa-app/supabase/migration.test.ts")
          test_text = test_path.read_text(encoding="utf-8")
          anchor = 'const generatedTestEditorSql = readFileSync(new URL("./migrations/202608110004_generated_test_editor_permissions.sql", import.meta.url), "utf8");'
          test_text = test_text.replace(anchor, anchor + '\nconst authenticatedScenarioEditorSql = readFileSync(new URL("./migrations/202608110005_authenticated_scenario_editor.sql", import.meta.url), "utf8");', 1)
          block = '''  it("allows scenario edits to replace only generated test steps", () => {
    expect(generatedTestEditorSql).toContain("grant delete on table public.generated_test_steps to service_role");
    expect(generatedTestEditorSql).not.toContain("public.generated_tests to service_role");
  });'''
          addition = block + '''
  it("uses authenticated ownership policies for scenario changes", () => {
    expect(authenticatedScenarioEditorSql).toContain("grant insert, update on table public.generated_tests to authenticated");
    expect(authenticatedScenarioEditorSql).toContain("grant insert, delete on table public.generated_test_steps to authenticated");
    expect(authenticatedScenarioEditorSql).toContain("grant insert, update on table public.test_runs to authenticated");
    expect(authenticatedScenarioEditorSql.match(/user_id = auth\.uid\(\)/g)).toHaveLength(8);
  });'''
          if anchor not in test_text or block not in test_text:
              raise SystemExit("missing migration test anchor")
          test_path.write_text(test_text.replace(block, addition, 1), encoding="utf-8")
          PY
      - name: Install dependencies
        working-directory: scenario-qa-app
        run: npm ci
      - name: Install Chromium
        working-directory: scenario-qa-app
        run: PLAYWRIGHT_BROWSERS_PATH=../scenario-test-runner/.playwright-browsers npx playwright install --with-deps chromium
      - name: Verify change
        working-directory: scenario-qa-app
        run: npm run check
      - name: Commit verified change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scenario-qa-app
          git diff --cached --quiet && exit 0
          git commit -m 'fix: use user session for scenario writes'
          git push
