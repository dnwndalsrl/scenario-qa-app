name: Deploy scenario dispatch fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/scenario-test-runner/.playwright-browsers
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply focused patch
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > /tmp/scenario-dispatch.patch
          git apply /tmp/scenario-dispatch.patch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scenario-qa-app/package-lock.json
      - name: Promote OpenAI SDK to runtime dependency
        working-directory: scenario-qa-app
        run: node -e "const fs=require('fs');const pkg=JSON.parse(fs.readFileSync('package.json'));pkg.dependencies.openai=pkg.optionalDependencies.openai;delete pkg.optionalDependencies.openai;fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');const lock=JSON.parse(fs.readFileSync('package-lock.json'));lock.packages[''].dependencies.openai=lock.packages[''].optionalDependencies.openai;delete lock.packages[''].optionalDependencies.openai;delete lock.packages['node_modules/openai'].optional;fs.writeFileSync('package-lock.json',JSON.stringify(lock,null,2)+'\n')"
      - name: Install dependencies
        working-directory: scenario-qa-app
        run: npm ci
      - name: Install Chromium
        working-directory: scenario-qa-app
        run: npx playwright install --with-deps chromium
      - name: Verify
        working-directory: scenario-qa-app
        run: npm run check
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scenario-qa-app
          git commit -m "fix: dispatch approved scenarios with user session"
          git push origin main
