name: Apply scenario save fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Write verified files
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > 'scenario-qa-app/server/api/analyses/[analysisId]/tests/[testId].put.ts'
          printf '%s' '' | base64 --decode > 'scenario-qa-app/server/api/analyses/[analysisId]/tests/[testId]/runs.post.ts'
          printf '%s' '' | base64 --decode > 'scenario-qa-app/server/services/generated-test-record.service.ts'
          printf '%s' '' | base64 --decode > 'scenario-qa-app/server/services/generated-test-record.service.test.ts'
          printf '%s' '' | base64 --decode > 'scenario-qa-app/server/services/supabase.service.ts'
          printf '%s' '' | base64 --decode > 'scenario-qa-app/server/services/supabase.service.test.ts'
          printf '%s' '' | base64 --decode > 'scenario-qa-app/supabase/migration.test.ts'
          printf '%s' '' | base64 --decode > 'scenario-qa-app/supabase/migrations/202608110004_generated_test_editor_permissions.sql'
      - name: Install dependencies
        working-directory: scenario-qa-app
        run: npm ci
      - name: Install Chromium
        working-directory: scenario-qa-app
        run: PLAYWRIGHT_BROWSERS_PATH=../scenario-test-runner/.playwright-browsers npx playwright install --with-deps chromium
      - name: Verify change
        working-directory: scenario-qa-app
        run: npm run check
      - name: Commit verified change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scenario-qa-app
          git diff --cached --quiet && exit 0
          git commit -m 'fix: persist edited QA scenarios'
          git push
