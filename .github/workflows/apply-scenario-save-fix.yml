name: Apply scenario save fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Write verified files
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > 'scenario-qa-app/server/services/supabase.service.ts'
          printf '%s' '' | base64 --decode > 'scenario-qa-app/server/api/analyses/[analysisId]/tests/[testId].put.ts'
          printf '%s' '' | base64 --decode > 'scenario-qa-app/server/api/analyses/[analysisId]/tests/[testId]/runs.post.ts'
          printf '%s' '' | base64 --decode > 'scenario-qa-app/server/api/analyses/[analysisId]/tests/index.post.ts'
          printf '%s' '' | base64 --decode > 'scenario-qa-app/server/api/analyses/[analysisId]/run.post.ts'
          printf '%s' '' | base64 --decode > 'scenario-qa-app/server/api/analyses/[analysisId]/cancel.post.ts'
          printf '%s' '' | base64 --decode > 'scenario-qa-app/server/api/analyses/[analysisId]/documents/continue.post.ts'
          printf '%s' '' | base64 --decode > 'scenario-qa-app/server/api/analyses/[analysisId]/index.delete.ts'
          printf '%s' '' | base64 --decode > 'scenario-qa-app/server/api/analyses/[analysisId]/retry.post.ts'
      - name: Install dependencies
        working-directory: scenario-qa-app
        run: npm ci
      - name: Install Chromium
        working-directory: scenario-qa-app
        run: PLAYWRIGHT_BROWSERS_PATH=../scenario-test-runner/.playwright-browsers npx playwright install --with-deps chromium
      - name: Verify change
        working-directory: scenario-qa-app
        run: npm run check
      - name: Commit verified change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scenario-qa-app
          git diff --cached --quiet && exit 0
          git commit -m 'fix: bind Supabase admin clients to request config'
          git push
