name: Finalize expected outcomes deployment

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove workflow and finalize
        run: |
          rm -f .github/workflows/codex-finalize-expected-outcomes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize expected outcome validation deployment"
          git push origin HEAD:main
