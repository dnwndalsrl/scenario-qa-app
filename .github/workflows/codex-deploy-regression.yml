name: Codex deploy production regression

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/scenario-test-runner/.playwright-browsers
      PATCH_B64: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply verified changes
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode | gzip --decompress > /tmp/change.patch
          git apply --index /tmp/change.patch
          git diff --cached --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scenario-qa-app/package-lock.json
      - name: Install dependencies
        working-directory: scenario-qa-app
        run: npm ci --include=optional
      - name: Install Chromium
        working-directory: scenario-qa-app
        run: npx playwright install chromium
      - name: Verify application
        working-directory: scenario-qa-app
        run: npm run check
      - name: Verify production regression
        working-directory: scenario-qa-app
        run: npm run regression:production
      - name: Commit and deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Automate production regression checks"
          git push origin HEAD:main
