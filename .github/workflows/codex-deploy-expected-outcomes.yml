name: Codex deploy expected outcomes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply verified patch
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/codex.patch
          git apply --index /tmp/codex.patch
          rm -f .github/workflows/codex-deploy-expected-outcomes.yml
          git config user.name "Codex Deployment"
          git config user.email "codex-deploy@users.noreply.github.com"
          git add -A
          git commit -m "Require expected outcomes for generated tests"
          git push origin HEAD:main
