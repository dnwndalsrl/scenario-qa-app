name: Codex deploy dispatch fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified patch
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d | gunzip > /tmp/codex.patch
          git apply --index /tmp/codex.patch
          git config user.name "codex-deploy"
          git config user.email "codex-deploy@users.noreply.github.com"
          git commit -m "fix: cast analysis dispatch status enum"
          git push origin HEAD:main
