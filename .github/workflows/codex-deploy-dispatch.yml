name: Codex deploy dispatch fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified files
        env:
          MIGRATION_B64: 
        run: |
          printf '%s' "$MIGRATION_B64" | base64 -d > scenario-qa-app/supabase/migrations/202608110003_fix_dispatch_state_enum_cast.sql
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scenario-qa-app/supabase/migration.test.ts")
          text = path.read_text()
          const_line = 'const dispatchStateFixSql = readFileSync(new URL("./migrations/202608110003_fix_dispatch_state_enum_cast.sql", import.meta.url), "utf8");'
          if const_line not in text:
              anchor = 'const requirementUploadSql = readFileSync(new URL("./migrations/202608110002_authenticated_requirement_upload.sql", import.meta.url), "utf8");'
              text = text.replace(anchor, anchor + "\n" + const_line)
          test_block = '''

  it("casts the dispatch status text to the analyses enum before updating", () => {
    expect(dispatchStateFixSql).toContain("status = p_status::public.analysis_status");
    expect(dispatchStateFixSql).toContain("user_id = auth.uid()");
    expect(dispatchStateFixSql).toContain("grant execute on function public.set_analysis_dispatch_state(uuid,text,text,text,jsonb) to authenticated");
  });'''
          if 'casts the dispatch status text to the analyses enum' not in text:
              index = text.rfind("\n});")
              text = text[:index] + test_block + text[index:]
          path.write_text(text)
          PY
          git add scenario-qa-app/supabase/migration.test.ts scenario-qa-app/supabase/migrations/202608110003_fix_dispatch_state_enum_cast.sql
          git config user.name "codex-deploy"
          git config user.email "codex-deploy@users.noreply.github.com"
          git commit -m "fix: cast analysis dispatch status enum"
          git push origin HEAD:main
