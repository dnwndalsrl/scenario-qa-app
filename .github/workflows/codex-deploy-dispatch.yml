name: Codex deploy dispatch fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified files
        env:
          MIGRATION_B64: 
          TEST_GZ_B64: 
        run: |
          printf '%s' "$MIGRATION_B64" | base64 -d > scenario-qa-app/supabase/migrations/202608110003_fix_dispatch_state_enum_cast.sql
          printf '%s' "$TEST_GZ_B64" | base64 -d | gunzip > scenario-qa-app/supabase/migration.test.ts
          git add scenario-qa-app/supabase/migration.test.ts scenario-qa-app/supabase/migrations/202608110003_fix_dispatch_state_enum_cast.sql
          git config user.name "codex-deploy"
          git config user.email "codex-deploy@users.noreply.github.com"
          git commit -m "fix: cast analysis dispatch status enum"
          git push origin HEAD:main
